<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="50%" stop-color="#0e7490" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Circular -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="#22d3ee" stroke-width="2.5" />
  
  <!-- Aura / Anillo Tecnológico -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.6" />

  <!-- Cabello / Casco estilizado -->
  <path d="M 32 62 C 30 42, 42 26, 60 26 C 78 26, 90 42, 88 62 C 86 78, 80 88, 76 92 C 72 84, 74 72, 70 66 C 66 60, 54 60, 50 66 C 46 72, 48 84, 44 92 C 40 88, 34 78, 32 62 Z" fill="#0f172a" />
  
  <!-- Reflejo Cyan en Cabello -->
  <path d="M 36 50 C 38 34, 48 28, 60 28 C 72 28, 82 34, 84 50 C 78 40, 68 36, 60 36 C 52 36, 42 40, 36 50 Z" fill="url(#glowGrad)" opacity="0.8" />

  <!-- Rostro -->
  <path d="M 42 54 C 42 74, 52 84, 60 84 C 68 84, 78 74, 78 54 C 78 46, 74 42, 60 42 C 46 42, 42 46, 42 54 Z" fill="#fde047" opacity="0.95" />
  <path d="M 42 54 C 42 74, 52 84, 60 84 C 68 84, 78 74, 78 54 C 78 46, 74 42, 60 42 C 46 42, 42 46, 42 54 Z" fill="#fed7aa" />

  <!-- Auricular / Diadema de Telecomunicaciones -->
  <path d="M 38 48 C 38 32, 82 32, 82 48" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />
  <rect x="33" y="48" width="6" height="12" rx="3" fill="#06b6d4" stroke="#ffffff" stroke-width="1" />
  <rect x="81" y="48" width="6" height="12" rx="3" fill="#06b6d4" stroke="#ffffff" stroke-width="1" />
  <!-- Micrófono hacia la boca -->
  <path d="M 36 58 Q 42 74 52 74" fill="none" stroke="#22d3ee" stroke-width="2" />
  <circle cx="53" cy="74" r="2.5" fill="#38bdf8" />

  <!-- Ojos Anime / Asistente Inteligente -->
  <ellipse cx="50" cy="58" rx="3" ry="4.5" fill="#0f172a" />
  <circle cx="51" cy="56" r="1.5" fill="#ffffff" />
  <circle cx="49" cy="60" r="0.8" fill="#38bdf8" />

  <ellipse cx="70" cy="58" rx="3" ry="4.5" fill="#0f172a" />
  <circle cx="71" cy="56" r="1.5" fill="#ffffff" />
  <circle cx="69" cy="60" r="0.8" fill="#38bdf8" />

  <!-- Sonrisa afable -->
  <path d="M 56 68 Q 60 72 64 68" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" />

  <!-- Destello de IA / Fibra Óptica en la frente -->
  <polygon points="60,34 62,39 67,40 63,43 64,48 60,45 56,48 57,43 53,40 58,39" fill="#22d3ee" filter="url(#glow)" />
</svg>

